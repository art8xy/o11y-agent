apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rocket
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: network
      sectionName: websecure
  hostnames:
    - rocket.o11y.local
  rules:
    - backendRefs:
        - name: rocketchat-rocketchat
          port: 80