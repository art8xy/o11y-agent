apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: network
      sectionName: websecure
  hostnames:
    - otel-demo.o11y.local
  rules:
    - backendRefs:
        - name: frontend-proxy
          port: 8080