deploymentMode: SingleBinary

singleBinary:
  persistence:
    enabled: true
    size: 5Gi

lokiCanary:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true

loki:  
  auth_enabled: false
  
  limits_config:
    allow_structured_metadata: true

  commonConfig:
    replication_factor: 1
  
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_
          period: 24h