apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-mcp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: network
      sectionName: websecure
  hostnames:
    - grafana-mcp.o11y.local
  rules:
    - backendRefs:
        - name: grafana-mcp
          port: 8000